# All tunables live here. Nothing below is claimed optimal; see results/ for measured ablations.
embedding_model:
  backend: lsa                       # lsa (CPU fallback, no downloads) | sentence_transformers
  name: "BAAI/bge-small-en-v1.5"     # used when backend == sentence_transformers
  fallback_to_lsa: true              # if the model cannot be loaded, fall back instead of crashing
  lsa_dim: 128
  batch_size: 32
  normalize_embeddings: true
  device: cpu                        # cpu | cuda
  max_seq_length: 256
representation: contextual           # raw | metadata | contextual  (what text is embedded)
chunking:
  max_chunk_lines: 60                # functions longer than this are split into logical blocks
  max_file_bytes: 1000000            # files larger than this are skipped with a warning
query:
  expand_concepts: true              # add related terms (normalize -> preprocess, sanitize ...)
  classify: true
retrieval:
  dense_top_k: 100
  bm25_top_k: 100
  identifier_top_k: 50
  candidate_size: 100
  dense_weight: 0.55
  bm25_weight: 0.30
  identifier_weight: 0.15
  fusion: weighted                   # weighted | rrf
  category_weights: true             # per-query-type multipliers (see query/classifier.py)
index:
  dir: indexes
  cache_dir: .cache
  ann: hnsw                          # hnsw | flat
  flat_threshold: 2000               # below this many chunks exact search is used (cheap + exact)
  hnsw_m: 32
  hnsw_ef_construction: 100
  hnsw_ef_search: 128
ranking:
  reranker: linear                   # linear | lambdamart | cross_encoder | none
  rerank_top_n: 50
  weights:
    semantic: 0.50
    bm25: 0.20
    identifier: 0.10
    metadata: 0.10
    structural: 0.10
  use_structural: true
  cross_encoder_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
dedup:
  enabled: true
  similarity_threshold: 0.90         # cross-version semantic near-duplicate threshold
